[project]
name = "colab-training"
version = "0.1.0"
description = "RT-DETR building detection: download COGs, tile, fine-tune and infer with PyTorch Lightning and Hydra"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.4",
    "transformers>=4.50",
    "torchmetrics>=1.4",
    "faster-coco-eval>=1.6",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rasterio>=1.3",
    "shapely>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pystac-client>=0.8",
    "scipy>=1.11",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false
